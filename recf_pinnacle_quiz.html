<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECF Achieve: Pinnacle 2026-2027 — Rules Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000000;--surface:#0d0d12;--surface2:#15151e;--surface3:#1e1e2a;
  --border:#2a2a3d;--text:#e8eaf0;--text2:#9ca3b8;--text3:#636b82;
  --accent:#800080;--accent2:#a832a8;--accent-glow:rgba(128,0,128,.15);
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);--green-border:rgba(34,197,94,.3);
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);--red-border:rgba(239,68,68,.3);
  --yellow:#eab308;--blue:#3b82f6;--blue-bg:rgba(59,130,246,.1);
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.03;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.app{max-width:800px;margin:0 auto;padding:24px 20px 60px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);font-size:.82rem;font-weight:600;text-decoration:none;margin-bottom:12px;opacity:.8;transition:opacity .2s}
.back-link:hover{opacity:1;text-decoration:underline}
.header{text-align:center;padding:40px 0 36px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-glow);border:1px solid rgba(128,0,128,.25);border-radius:100px;padding:6px 16px 6px 10px;margin-bottom:16px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.logo-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 30%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text2);margin-top:10px;font-size:.92rem;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.5}
.categories{display:grid;gap:12px;margin-top:36px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.cat-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(128,0,128,.08)}
.cat-card.selected{border-color:var(--accent);background:var(--accent-glow)}
.cat-card .cat-tag{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--accent2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.cat-card h3{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.cat-card p{font-size:.82rem;color:var(--text3);line-height:1.4}
.cat-card .q-count{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;padding:12px 28px;border-radius:10px;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 6px 24px rgba(128,0,128,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--text3)}
.btn-group{display:flex;gap:10px;margin-top:28px;justify-content:center;flex-wrap:wrap}
.progress-bar{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.progress-track{flex:1;height:6px;background:var(--surface2);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:100px;transition:width .4s ease}
.progress-text{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text3);white-space:nowrap}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;position:relative;overflow:hidden}
.quiz-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--accent))}
.q-category{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
.q-rule-ref{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text3);margin-bottom:14px;padding:4px 10px;background:var(--surface2);border-radius:6px;display:inline-block}
.q-text{font-size:1.08rem;line-height:1.6;font-weight:500;margin-bottom:24px}
.options{display:grid;gap:10px}
.option{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--text);line-height:1.5}
.option:hover:not(.locked){border-color:var(--accent);background:var(--accent-glow)}
.option .letter{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;color:var(--text3);background:var(--bg);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0;margin-top:1px}
.option.correct{border-color:var(--green);background:var(--green-bg)}.option.correct .letter{background:var(--green);color:#fff}
.option.wrong{border-color:var(--red);background:var(--red-bg)}.option.wrong .letter{background:var(--red);color:#fff}
.option.locked{cursor:default}
.explanation{margin-top:18px;border-radius:12px;font-size:.88rem;line-height:1.6;animation:slideIn .3s ease;overflow:hidden}
.explanation.correct-exp{background:var(--green-bg);border:1px solid var(--green-border)}
.explanation.wrong-exp{background:var(--red-bg);border:1px solid var(--red-border)}
.exp-header{padding:14px 18px 0;font-weight:700;font-size:.95rem}
.correct-exp .exp-header{color:var(--green)}.wrong-exp .exp-header{color:var(--red)}
.exp-body{padding:6px 18px 14px;color:var(--text2)}.correct-exp .exp-body{color:var(--green)}
.exp-correct-ans{margin:0 18px;padding:10px 14px;border-radius:8px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);font-size:.84rem;font-weight:600;display:flex;align-items:flex-start;gap:8px}
.exp-correct-ans svg{width:16px;height:16px;fill:var(--green);flex-shrink:0;margin-top:2px}
.rule-cite{margin:14px 18px 18px;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--border)}
.rule-cite-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rule-cite-header svg{width:16px;height:16px;fill:var(--accent2);flex-shrink:0}
.rule-cite-header span{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--accent2);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.rule-cite-rule{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:2px}
.rule-cite-headline{font-size:.82rem;color:var(--yellow);font-weight:600;margin-bottom:10px;font-style:italic}
.rule-cite-text{font-size:.82rem;color:var(--text2);line-height:1.6;border-left:3px solid var(--accent);padding-left:12px;margin-bottom:10px}
.rule-cite-penalty{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px}
.rule-cite-penalty.red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid var(--red-border)}
.rule-cite-penalty.warn{background:rgba(234,179,8,.1);color:var(--yellow);border-color:rgba(234,179,8,.3)}
.rule-cite-penalty.info{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.results{text-align:center;padding:20px 0}
.score-ring{width:180px;height:180px;margin:0 auto 24px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.score-ring .bg{stroke:var(--surface2)}.score-ring .fg{transition:stroke-dashoffset 1.5s ease}
.score-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-pct .num{font-family:'Archivo Black',sans-serif;font-size:2.8rem;line-height:1}
.score-pct .label{font-size:.78rem;color:var(--text3);margin-top:2px}
.results h2{font-family:'Archivo Black',sans-serif;font-size:1.5rem;margin-bottom:8px}
.stat-row{display:flex;gap:16px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 22px;min-width:110px}
.stat .val{font-family:'Archivo Black',sans-serif;font-size:1.4rem}.stat .lbl{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.stat.green .val{color:var(--green)}.stat.red .val{color:var(--red)}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:10px;text-align:left}
.review-item .ri-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review-item .ri-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;background:var(--red-bg);color:var(--red)}
.review-item .ri-q{font-weight:600;font-size:.88rem;line-height:1.4}
.review-item .ri-detail{font-size:.82rem;color:var(--text2);line-height:1.5;margin-top:6px}
.review-item .ri-cite{margin-top:10px;padding:12px 14px;border-radius:8px;background:rgba(0,0,0,.2);border:1px solid var(--border)}
.review-item .ri-cite-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--accent2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.review-item .ri-cite-hl{font-size:.78rem;color:var(--yellow);font-weight:600;font-style:italic;margin-bottom:6px}
.review-item .ri-cite-text{font-size:.78rem;color:var(--text3);line-height:1.5;border-left:2px solid var(--accent);padding-left:10px;margin-bottom:6px}
.review-item .ri-cite-pen{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--red);font-weight:600}
.review-toggle{margin:20px 0 12px;font-size:.85rem;color:var(--accent2);cursor:pointer;font-weight:600}
.review-toggle:hover{text-decoration:underline}
.diff-badge{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-left:8px}
.diff-badge.easy{background:rgba(34,197,94,.12);color:var(--green)}
.diff-badge.medium{background:rgba(234,179,8,.12);color:var(--yellow)}
.diff-badge.hard{background:rgba(239,68,68,.12);color:var(--red)}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.quiz-card{padding:22px 18px}.cat-card .q-count{position:static;transform:none;margin-top:8px}.stat-row{gap:10px}.stat{min-width:90px;padding:10px 14px}.rule-cite{margin:14px 12px 14px}.exp-correct-ans{margin:0 12px}.exp-header,.exp-body{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="app" id="app"></div>
<script>
const Q=[
// ═══════ DEFINITIONS (Section 1.5) ═══════
{cat:"definitions",catLabel:"Definitions",rule:"Section 1.5.1",ruleId:"Section 1.5.1",headline:"Drive Team",ruleText:"Drive Team \u2014 1-3 students who participate in a match as representatives for their team.",penalty:"N/A \u2014 Definition",penType:"info",q:"How many students can be on a Drive Team?",options:["1-2 students","1-3 students","2-4 students","Exactly 3 students"],answer:1,explain:"A Drive Team consists of 1-3 students who participate in a match as representatives for their team.",wrongExp:"The manual specifies exactly 1-3 students. Not 2-4, not exactly 3, and not limited to just 1-2. This allows flexibility for teams of varying sizes.",diff:"easy"},

{cat:"definitions",catLabel:"Definitions",rule:"Section 1.5.1",ruleId:"Section 1.5.1",headline:"Grounded",ruleText:"Grounded \u2014 Description of a robot that has broken a safety rule and is no longer allowed to participate in the match; the robot is not allowed to drive, and the controller should be placed on the floor or another nearby position (not on the field).",penalty:"Robot cannot drive for remainder of match",penType:"red",q:"What does it mean when a robot is \u2018Grounded\u2019?",options:["The robot has tipped over","The robot has broken a safety rule and can no longer drive in the match","The robot\u2019s battery has died","The robot is touching the field tiles"],answer:1,explain:"A Grounded robot has broken a safety rule and is no longer allowed to participate \u2014 the controller must be placed on the floor.",wrongExp:"Grounding is specifically a penalty for breaking a safety rule. It is not about tipping, battery failure, or field contact. The drive team must stop operating the robot and place their controller on the ground (not on the field).",diff:"easy"},

{cat:"definitions",catLabel:"Definitions",rule:"Section 1.5.2",ruleId:"Section 1.5.2",headline:"Pinnacle (game object)",ruleText:"Pinnacle \u2014 A two-object stack that consists of one pin nested to one cup.",penalty:"N/A \u2014 Definition",penType:"info",q:"What is a \u2018Pinnacle\u2019 in the context of this game?",options:["The tallest goal on the field","A two-object stack of one pin nested to one cup","A stack of three or more cups","The center zone of the field"],answer:1,explain:"A Pinnacle is specifically a two-object stack: one pin nested to one cup.",wrongExp:"The term Pinnacle has a precise game-specific meaning \u2014 it is not a field element or zone name. It refers exclusively to the combination of exactly one pin nested into one cup, forming a two-object stack.",diff:"easy"},

{cat:"definitions",catLabel:"Definitions",rule:"Section 1.5.2",ruleId:"Section 1.5.2",headline:"Nested",ruleText:"Nested \u2014 A description for a connection between a cup and a pin, or a pin and a goal, in which a convex halfpin fits securely inside of the opening on a goal or one concave half of a cup. A halfpin can be nested into a cup or a goal. A cup can be nested onto a pinhalf.",penalty:"N/A \u2014 Definition",penType:"info",q:"What must be true for a pin to count as \u2018Nested\u2019?",options:["The pin must be sitting on top of a goal","A convex halfpin must fit securely inside the opening on a goal or a concave half of a cup","The pin must be touching the field tile","The pin must be within 1 inch of a goal"],answer:1,explain:"Nested requires a convex halfpin to fit securely inside a goal opening or a concave cup half.",wrongExp:"Simply being on top of or near a goal does not count as nested. The manual requires a secure physical connection where the convex halfpin fits inside the goal opening or cup cavity. This is critical because cups and pins must be nested to count as scored.",diff:"medium"},

{cat:"definitions",catLabel:"Definitions",rule:"Section 1.5.2",ruleId:"Section 1.5.2",headline:"Zone definitions",ruleText:"Zone \u2014 5 defined areas of the field: Red zone (4\u2019W x 12\u2019L), Blue zone (4\u2019W x 12\u2019L), Neutral zone 1 (4\u2019W x 4\u2019L), Neutral zone 2 (4\u2019W x 4\u2019L), and Center zone (4\u2019W x 4\u2019L). Neutral zones 1 & 2 and the center zone are collectively referred to as \u2018the neutral zone.\u2019",penalty:"N/A \u2014 Definition",penType:"info",q:"How many defined zones does the Pinnacle field have?",options:["3","4","5","6"],answer:2,explain:"The field has 5 zones: Red, Blue, Neutral 1, Neutral 2, and Center.",wrongExp:"Many teams mistakenly count only 3 or 4 zones. The manual defines exactly 5: the Red zone, Blue zone, Neutral zone 1, Neutral zone 2, and Center zone. The neutral zones and center zone are collectively called \u2018the neutral zone\u2019 but are counted as 3 separate defined areas.",diff:"medium"},

// ═══════ FOULS & PENALTIES (Section 1.6) ═══════
{cat:"fouls",catLabel:"Fouls & Penalties",rule:"Section 1.6",ruleId:"Section 1.6",headline:"Fouls & Penalties",ruleText:"Fouls are decided by a head referee during a match and occur when a rule of gameplay or safety is broken. Teams should not be penalized if they\u2019re forced into a foul by an opponent.",penalty:"Varies by severity",penType:"warn",q:"Who decides fouls during a match?",options:["The event partner","The scorekeeper referee","The head referee","A vote by both alliances"],answer:2,explain:"Fouls are decided by the head referee during a match.",wrongExp:"Only the head referee has authority to decide fouls during a match. The event partner handles non-match decisions, and scorekeeper referees score matches but should consult the head referee on unclear calls. There is no voting process.",diff:"easy"},

{cat:"fouls",catLabel:"Fouls & Penalties",rule:"Section 1.6.1",ruleId:"Section 1.6.1",headline:"Official Warning",ruleText:"An official warning is given to an alliance, team, or team member verbally by the head referee the first time they break a specific rule, provided the foul does not affect the outcome of a match. Future violations of the same rule should result in a yellow card for that rule.",penalty:"Official Warning (verbal, first offense)",penType:"warn",q:"What is an Official Warning?",options:["An immediate penalty that deducts points","A verbal notice given the first time a team breaks a specific rule, provided it doesn\u2019t affect the match outcome","A written notice sent to the team\u2019s coach","A warning that automatically becomes a red card"],answer:1,explain:"An Official Warning is given verbally the first time a specific rule is broken, as long as it didn\u2019t affect the match outcome.",wrongExp:"An Official Warning does not deduct points, is not written, and does not automatically become a red card. It is a verbal learning opportunity given on the FIRST offense of a specific rule. Only future violations of that same rule escalate to a yellow card.",diff:"easy"},

{cat:"fouls",catLabel:"Fouls & Penalties",rule:"Section 1.6.2 / 1.6.3",ruleId:"Section 1.6.2 & 1.6.3",headline:"Yellow Card \u2192 Red Card escalation",ruleText:"A yellow card is given the second time they break a rule (after receiving an official warning). A red card is given the third time they break a rule (after receiving a yellow card). A team that receives a red card will earn zero points for the current match.",penalty:"Yellow Card (2nd offense) \u2192 Red Card (3rd offense, zero points for match)",penType:"red",q:"What is the penalty escalation order for repeated violations of the same rule?",options:["Yellow Card \u2192 Red Card \u2192 Disqualification","Official Warning \u2192 Yellow Card \u2192 Red Card","Verbal Warning \u2192 Grounding \u2192 Disqualification","Minor Foul \u2192 Major Foul \u2192 Red Card"],answer:1,explain:"The escalation is: Official Warning (1st) \u2192 Yellow Card (2nd) \u2192 Red Card (3rd and beyond).",wrongExp:"The manual defines a specific three-step escalation for each rule: Official Warning on first offense, Yellow Card on second offense, and Red Card on third (and subsequent) offenses. There is no \u2018disqualification\u2019 or \u2018grounding\u2019 step in this escalation \u2014 those are separate concepts.",diff:"medium"},

{cat:"fouls",catLabel:"Fouls & Penalties",rule:"Section 1.6.3",ruleId:"Section 1.6.3",headline:"Red Card consequences",ruleText:"A team that receives a red card will earn zero points for the current match. In an alliance match, a team that does not receive the red card will receive the actual score of the match. In finals matches, both teams in the alliance will receive a zero score.",penalty:"Zero points for match; in finals, entire alliance gets zero",penType:"red",q:"In a finals match, what happens to the alliance partner of a team that receives a red card?",options:["The partner receives the actual score","The partner also receives zero points","The partner receives half the score","The partner is disqualified from the event"],answer:1,explain:"In finals matches, both teams in the alliance receive a zero score when either team gets a red card.",wrongExp:"This is a critical distinction between regular alliance matches and finals matches. In regular alliance matches, only the offending team gets zero while the partner keeps the actual score. But in finals matches, BOTH teams in the alliance receive zero. This makes red cards especially devastating in elimination rounds.",diff:"hard"},

{cat:"fouls",catLabel:"Fouls & Penalties",rule:"Section 1.6.4",ruleId:"Section 1.6.4",headline:"Fouls affect eligibility",ruleText:"Any team that receives three or more red cards during an event cannot be part of alliance selection or the elimination bracket. Eligibility for judged awards may also be affected.",penalty:"Ineligible for alliance selection and elimination bracket",penType:"red",q:"How many red cards make a team ineligible for alliance selection?",options:["1 red card","2 red cards","3 or more red cards","5 or more red cards"],answer:2,explain:"Three or more red cards during an event disqualifies a team from alliance selection and elimination.",wrongExp:"The threshold is specifically three or more red cards at a single event. One or two red cards, while costly (zero match scores), do not prevent a team from participating in alliance selection. Eligibility for judged awards may also be affected.",diff:"medium"},

// ═══════ ROBOT BUILD (Section 2) ═══════
{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.1",ruleId:"Section 2.2.1",headline:"Robot starting size",ruleText:"Your robot can\u2019t be larger than 18\u201d wide by 18\u201d long by 18\u201d tall at the start of the match. Your robot can\u2019t ever be larger than 24\u201d wide by 24\u201d long during the match. There is no limit to how tall your robot can be during the match.",penalty:"Robot will not pass inspection / foul during match",penType:"warn",q:"What is the maximum starting size for a robot?",options:["18\u201d x 18\u201d x 24\u201d","24\u201d x 24\u201d x 24\u201d","18\u201d x 18\u201d x 18\u201d","12\u201d x 12\u201d x 12\u201d"],answer:2,explain:"Robots must start within 18\u201d x 18\u201d x 18\u201d but can expand to 24\u201d x 24\u201d (no height limit) during the match.",wrongExp:"The starting configuration is exactly 18\u201d \u00d7 18\u201d \u00d7 18\u201d. During the match, the robot can expand up to 24\u201d \u00d7 24\u201d with no height limit. The 24\u201d dimension is the absolute maximum during play, not the starting size.",diff:"easy"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.1",ruleId:"Section 2.2.1",headline:"Maximum in-match size",ruleText:"Your robot can\u2019t ever be larger than 24\u201d wide by 24\u201d long during the match. There is no limit to how tall your robot can be during the match.",penalty:"Foul / Grounding",penType:"warn",q:"During a match, is there a height limit for the robot?",options:["Yes \u2014 24 inches","Yes \u2014 36 inches","Yes \u2014 18 inches","No \u2014 there is no height limit during a match"],answer:3,explain:"There is no height limit during the match. The 24\u201d limit only applies to width and length.",wrongExp:"This is a key rule that many teams overlook. While the robot is limited to 24\u201d x 24\u201d in width and length during play, the manual explicitly states there is NO height limit during the match. This allows for tall stacking or lifting mechanisms.",diff:"medium"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.3",ruleId:"Section 2.2.3",headline:"License Plates",ruleText:"Your official registered RECF Achieve team number must be clearly visible from two sides of your robot on red or blue plates. Each robot must include exactly two license plates, and only the current license plate color can be visible during a match. Failure to have the appropriate license plates on your robot is a foul.",penalty:"Foul for missing/incorrect license plates",penType:"warn",q:"How many license plates must a robot have?",options:["One on each side (4 total)","Exactly two","At least one","Three"],answer:1,explain:"Each robot must include exactly two license plates, visible from two sides, matching the current alliance color.",wrongExp:"The manual is specific: exactly two license plates, not one, not four. They must show the team number on red or blue plates matching the alliance color, and only the current color can be visible during a match. Missing or incorrect plates is a foul.",diff:"easy"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.4",ruleId:"Section 2.2.4",headline:"Custom Plastic limit",ruleText:"Up to twelve individual custom plastic pieces, in two styles: Flat cut (up to 4\u201dx12\u201d, non-shattering plastic up to 0.070\u201d thick) or 3D printed (up to 3\u201dx5\u201dx2\u201d). Custom plastic parts must be designed or customized by student team members.",penalty:"Robot will not pass inspection",penType:"warn",q:"How many custom plastic pieces are allowed on a robot?",options:["Up to 6","Up to 12","Up to 20","Unlimited"],answer:1,explain:"Up to twelve individual custom plastic pieces are allowed, either flat-cut or 3D printed.",wrongExp:"The limit is exactly 12 individual pieces. These can be a combination of flat-cut (up to 4\u201d\u00d712\u201d, \u22640.070\u201d thick) and 3D printed (up to 3\u201d\u00d75\u201d\u00d72\u201d). Custom license plates, controller accessories, basic spacers, and adapter parts do NOT count toward this limit.",diff:"medium"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.4",ruleId:"Section 2.2.4",headline:"Motor power limit",ruleText:"Motors up to a total of 99W. Legal motors: VEX V5\u00ae Smart Motor 11W and VEX V5\u00ae Smart Motor 5.5W.",penalty:"Robot will not pass inspection",penType:"warn",q:"What is the maximum total motor wattage allowed on a robot?",options:["66W","88W","99W","132W"],answer:2,explain:"Total motor power is capped at 99W using VEX V5\u00ae Smart Motors (11W and/or 5.5W).",wrongExp:"The limit is exactly 99W total. Using only 11W motors, that allows up to 9 motors (9 \u00d7 11W = 99W). Teams can also mix 11W and 5.5W motors as long as the total does not exceed 99W.",diff:"medium"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.2.5",ruleId:"Section 2.2.5",headline:"Disallowed items",ruleText:"Disallowed: any electronic components from a system other than VEX V5\u00ae (including motors, servos, controllers, cables, sensors, batteries, and radios from Robits\u00ae by AndyMark and Pitsco Education TETRIX\u00ae MAX). Also disallowed: structural parts from non-approved systems, and anything that compromises safety.",penalty:"Robot will not pass inspection",penType:"warn",q:"Can a team use a motor from the Robits\u00ae by AndyMark system?",options:["Yes \u2014 all Robits\u00ae parts are legal","Yes \u2014 but only with an adapter","No \u2014 only VEX V5\u00ae electronics are allowed","Only if the total wattage stays under 99W"],answer:2,explain:"Electronic components from Robits\u00ae and TETRIX\u00ae MAX are explicitly prohibited. Only VEX V5\u00ae electronics are legal.",wrongExp:"While Robits\u00ae structural and mechanical parts ARE legal, their electronic components (motors, servos, controllers, cables, sensors, batteries, radios) are explicitly prohibited. Only VEX V5\u00ae electronics may be used. This is a common source of confusion since the structural parts are cross-compatible.",diff:"medium"},

{cat:"robot",catLabel:"Design, Build & Code",rule:"Section 2.3.1",ruleId:"Section 2.3.1",headline:"Students create their own code",ruleText:"A team\u2019s student members get to decide what their robot\u2019s code looks like, and what it does. Adults may teach coding concepts, but may not tell students what should or should not be included in their code.",penalty:"RECF Code of Conduct violation",penType:"warn",q:"What role may adult mentors play in robot coding?",options:["They can write the code as long as students approve it","They can teach coding concepts but cannot dictate what goes in the code","They can write 50% of the code","They have no restrictions on coding involvement"],answer:1,explain:"Adults may teach concepts but cannot tell students what should or should not be in their code. Students make all coding decisions.",wrongExp:"The manual draws a clear line: adults may teach coding concepts (loops, sensors, PID control, etc.) but may NOT tell students what should or should not be included in their code. The student-centered policy requires all design decisions, including code, to come from the students themselves.",diff:"easy"},

// ═══════ SOLO DRIVING MATCHES (Section 3) ═══════
{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3",ruleId:"Section 3",headline:"Solo match duration",ruleText:"In Pinnacle solo driving matches, student drive teams have 60 seconds to score as many points as possible while operating their robot with a remote controller.",penalty:"N/A",penType:"info",q:"How long is a solo driving match?",options:["30 seconds","45 seconds","60 seconds","120 seconds"],answer:2,explain:"Solo driving matches are 60 seconds long.",wrongExp:"Solo matches (both driving and coding) are exactly 60 seconds. Alliance matches are 120 seconds (15-second autonomous + 105-second driver-controlled). Don\u2019t confuse the two match types.",diff:"easy"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.1.7",ruleId:"Section 3.1.7",headline:"Center goal scoring",ruleText:"Each visible halfpin that is scored on the center goal earns 10 points.",penalty:"N/A \u2014 Scoring rule",penType:"info",q:"How many points is a visible halfpin worth on the center goal in a solo match?",options:["5 points","10 points","15 points","20 points"],answer:1,explain:"Each visible halfpin on the center goal is worth 10 points \u2014 double the value of other goals.",wrongExp:"The center goal awards 10 points per visible halfpin, regardless of color. This is double the 5 points earned on alliance or neutral goals. The center goal has no corresponding roller, so there are no color restrictions for scoring.",diff:"easy"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.1.5 / 3.1.6",ruleId:"Section 3.1.5 & 3.1.6",headline:"Yellow halfpin scoring requirements",ruleText:"Each visible yellow halfpin scored on a red or neutral goal earns 5 points only if the roller in that goal\u2019s zone is set to red. Each visible yellow halfpin scored on a blue goal earns 5 points only if the roller in that goal\u2019s zone is set to blue.",penalty:"N/A \u2014 Scoring rule",penType:"info",q:"When does a yellow halfpin earn points on a red goal?",options:["Always \u2014 yellow scores on any goal","Only if the roller in that zone is set to red","Only if the roller in that zone is set to yellow","Yellow halfpins never score on red goals"],answer:1,explain:"Yellow halfpins earn 5 points on a red/neutral goal only when the roller in that zone is set to red.",wrongExp:"Yellow halfpins have a conditional scoring requirement: they only earn points when the roller in the corresponding zone matches the goal color (red roller for red/neutral goals, blue roller for blue goals). If the roller shows yellow, yellow halfpins earn zero. This makes roller control a key strategic element.",diff:"medium"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.3.2",ruleId:"Section 3.3.2",headline:"Possession limit",ruleText:"A robot can carry up to one unstacked pin, one unstacked cup, and one stack of any height at any time. Playing the game while carrying extra objects after being asked to stop driving by a head referee will result in a foul.",penalty:"Foul (Official Warning \u2192 Yellow Card \u2192 Red Card escalation)",penType:"warn",q:"What is the maximum a robot can carry at one time?",options:["One pin and one cup only","One pin, one cup, and one stack of any height","Two stacks of any height","Unlimited objects"],answer:1,explain:"One unstacked pin, one unstacked cup, and one stack of any height \u2014 simultaneously.",wrongExp:"The possession limit is specific: one unstacked pin + one unstacked cup + one stack of any height. A team can avoid a foul by stopping all match play to remove extra objects. If they can\u2019t remove them, they should consider self-grounding for the rest of the match.",diff:"medium"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.3.3",ruleId:"Section 3.3.3",headline:"Objects stay in the game",ruleText:"Removing a cup or pin from the field is a foul. Intentional or egregious fouls will receive red cards. Cups or pins that are leaving the field cannot be deflected back into the field by humans, or by anything outside of the field.",penalty:"Foul; intentional/egregious = Red Card",penType:"red",q:"What happens if a team intentionally removes a pin from the field?",options:["Official Warning only","Yellow Card","Red Card","No penalty if it was accidental"],answer:2,explain:"Intentional or egregious removal of game objects results in a Red Card.",wrongExp:"While accidental removal follows the normal escalation (Official Warning \u2192 Yellow Card \u2192 Red Card), intentional or egregious removal jumps straight to a Red Card. Additionally, objects leaving the field cannot be deflected back in by humans or anything outside the field.",diff:"medium"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.2.4",ruleId:"Section 3.2.4",headline:"Eye protection",ruleText:"Every drive team member has to wear some form of eye protection. Eyeglasses meet the requirement, but we recommend safety glasses with non-shattering lenses and side shields.",penalty:"Team cannot participate until corrected",penType:"warn",q:"Do regular eyeglasses satisfy the eye protection requirement?",options:["No \u2014 only ANSI-rated safety glasses are accepted","Yes \u2014 eyeglasses meet the requirement","Only if they have side shields","Only prescription safety glasses count"],answer:1,explain:"Eyeglasses meet the requirement, though safety glasses with non-shattering lenses and side shields are recommended.",wrongExp:"Unlike some other robotics competitions that require specific ANSI or CE rated safety glasses, RECF Achieve accepts regular eyeglasses as meeting the eye protection requirement. However, the manual recommends safety glasses with non-shattering lenses and side shields for better protection.",diff:"easy"},

{cat:"solo",catLabel:"Solo Driving Matches",rule:"Section 3.4.4",ruleId:"Section 3.4.4",headline:"Appealing a decision",ruleText:"Referees and drive team members may never view video or photos from the match while at the field or during discussions that affect match outcomes or scoring, and team members who were not at the field for the match are not allowed to approach the field.",penalty:"N/A \u2014 Procedure",penType:"info",q:"Can video replays be used to appeal a referee\u2019s scoring decision?",options:["Yes \u2014 video evidence is encouraged","Yes \u2014 but only from official event cameras","No \u2014 video and photos are never allowed during scoring discussions at the field","Only the head referee may review video"],answer:2,explain:"Video and photos may never be viewed at the field during scoring discussions. Only the game manual and Q&A answers are valid references.",wrongExp:"This is an absolute prohibition: NO video or photos may be viewed at the field during any discussion affecting match outcomes or scoring. Teams should reference specific rules from the game manual or official Q&A answers instead. Team members who were not at the field during the match may not approach the field.",diff:"medium"},

// ═══════ SOLO CODING MATCHES (Section 4) ═══════
{cat:"coding",catLabel:"Solo Coding Matches",rule:"Section 4.1.1",ruleId:"Section 4.1.1",headline:"No driving the robot",ruleText:"Drive team members must still attach their controller to the field controller if required by the event, but can\u2019t use the controller to operate the robot during the match.",penalty:"Foul for using controller to drive",penType:"warn",q:"In a Solo Coding Match, can drive team members use the controller to operate the robot?",options:["Yes \u2014 coding matches allow partial manual control","Yes \u2014 but only during the last 15 seconds","No \u2014 the controller cannot be used to operate the robot","No controller is needed at all"],answer:2,explain:"The controller must be attached to the field system if required, but cannot be used to operate the robot. The robot runs on pre-written code only.",wrongExp:"Solo Coding Matches are fully autonomous \u2014 the robot operates entirely by pre-written student code. The controller must still be physically connected to the field control system if required, but using it to operate the robot is not allowed. All other Section 3 rules still apply unless specifically changed.",diff:"easy"},

{cat:"coding",catLabel:"Solo Coding Matches",rule:"Section 4",ruleId:"Section 4",headline:"Solo Coding rules basis",ruleText:"In Pinnacle solo coding matches, teams have 60 seconds to score as many points as possible using only pre-written code to operate the robot. Rules from Section 3: Solo Driving Matches apply unless they\u2019re specifically changed by a rule in this section.",penalty:"N/A",penType:"info",q:"Which rules apply to Solo Coding Matches?",options:["Only Section 4 rules","Section 3 rules unless specifically changed by Section 4","Section 5 Alliance Match rules","Completely separate rules not found elsewhere"],answer:1,explain:"All Section 3 (Solo Driving) rules apply to Solo Coding Matches unless specifically overridden by Section 4.",wrongExp:"Section 4 is deliberately short because it inherits nearly all rules from Section 3 (Solo Driving Matches). The only change is that the controller cannot be used to operate the robot \u2014 everything else (scoring, possession limits, field control, etc.) remains the same.",diff:"easy"},

// ═══════ ALLIANCE MATCHES (Section 5) ═══════
{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5",ruleId:"Section 5",headline:"Alliance match duration",ruleText:"In Pinnacle alliance matches, teams have 120 seconds to score as many points as possible. Each match includes two teams paired as a red alliance and two teams paired as a blue alliance. Alliance matches consist of a 15-second autonomous period followed by a 105-second driver-controlled period.",penalty:"N/A",penType:"info",q:"How long is an Alliance Match, and how is it structured?",options:["60 seconds, all driver-controlled","90 seconds: 15s autonomous + 75s driver","120 seconds: 15s autonomous + 105s driver","120 seconds, all driver-controlled"],answer:2,explain:"Alliance matches are 120 seconds: a 15-second autonomous period followed by 105 seconds of driver-controlled play.",wrongExp:"Alliance matches are exactly 120 seconds total, split into two periods: a 15-second autonomous period (robot runs on code only) followed by a 105-second driver-controlled period. This is different from solo matches which are 60 seconds of pure driver or code control.",diff:"easy"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.1.5",ruleId:"Section 5.1.5",headline:"Parked robot",ruleText:"Each robot in contact with one of their alliance\u2019s loaders at the end of the match earns 21 points, with a maximum of one robot per loader.",penalty:"N/A \u2014 Scoring rule",penType:"info",q:"How many points does a parked robot earn in an Alliance Match?",options:["10 points","15 points","21 points","25 points"],answer:2,explain:"Each robot touching an alliance loader at match end earns 21 points, max one robot per loader.",wrongExp:"Parking earns exactly 21 points per robot. Both alliance robots can park (one at each loader) for a total of 42 parking points. The robot must be in contact with one of their alliance\u2019s loaders \u2014 not the opponent\u2019s loaders \u2014 when the match timer reaches zero.",diff:"easy"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.3.5",ruleId:"Section 5.3.5",headline:"Alliance-colored goals are protected",ruleText:"Alliances can\u2019t interact with the goals in their opponent\u2019s alliance-colored zone, including adding or removing nested pins or cups. Breaking this rule will result in a red card, unless the robot was forced into the penalty by a robot from the other alliance.",penalty:"Red Card (unless forced by opponent)",penType:"red",q:"What happens if a robot interacts with an opponent\u2019s alliance-colored goal?",options:["Official Warning","Yellow Card","Red Card, unless forced by the opponent","No penalty \u2014 all goals are open"],answer:2,explain:"Interacting with an opponent\u2019s alliance goal (adding or removing objects) results in a Red Card, unless forced by the opponent.",wrongExp:"Alliance-colored goals have strong protection \u2014 any interaction (adding or removing pins/cups) is an immediate Red Card. The only exception is if the offending robot was forced into the penalty by the opposing alliance. This is much stricter than neutral zone goals, which are unprotected (Section 5.3.4).",diff:"medium"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.3.6",ruleId:"Section 5.3.6",headline:"Trapping/holding limit",ruleText:"Teams can only limit the actions of an opponent robot (i.e., trap, hold, or lift) for a 4-count (approximately four seconds). A trap/hold/lift that lasts longer than a 4-count is a foul, and can result in a red card at the head referee\u2019s discretion.",penalty:"Foul; can result in Red Card at referee\u2019s discretion",penType:"red",q:"How long can a robot trap or hold an opponent robot?",options:["2 seconds","4-count (approximately 4 seconds)","6 seconds","10 seconds"],answer:1,explain:"Trapping, holding, or lifting an opponent is limited to a 4-count (~4 seconds). Longer earns a foul and possible Red Card.",wrongExp:"The limit is a 4-count (approximately 4 seconds). The count pauses when the trapped robot has an escape route, or when the robots separate for another 4-count. If the interaction resumes before the second 4-count ends, the original count resumes. Exceeding the limit is a foul and can escalate to a Red Card.",diff:"medium"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.3.1",ruleId:"Section 5.3.1",headline:"Autonomous period boundaries",ruleText:"Robots aren\u2019t allowed to contact anything on the opponent\u2019s side of the neutral zone during autonomous. They can contact anything in their own alliance-colored zone, and anything in the neutral zone including all tape lines.",penalty:"Foul (no autonomous ranking point; Code of Conduct/Red Card fouls tracked)",penType:"warn",q:"During the autonomous period, where can a robot go?",options:["Anywhere on the field","Only their own alliance zone","Their alliance zone and the neutral zone, but not the opponent\u2019s side","Only the center zone"],answer:2,explain:"During autonomous, robots can access their own alliance zone and the neutral zone, but cannot contact anything on the opponent\u2019s side.",wrongExp:"The autonomous period has strict territorial limits: a robot can operate in its own alliance-colored zone and the neutral zone (including tape lines), but cannot contact anything on the opponent\u2019s side. Violating this forfeits the autonomous ranking point, and only Code of Conduct or Red Card fouls are tracked during autonomous.",diff:"medium"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.3.3",ruleId:"Section 5.3.3",headline:"Autonomous period fouls",ruleText:"If a team breaks any rule during the autonomous period of a match, they can\u2019t receive an autonomous ranking point. Fouls during the autonomous period are only recorded and tracked if they\u2019re related to the RECF Code of Conduct or result in a red card; other fouls should not result in foul cards or affect the overall match score.",penalty:"Loss of autonomous ranking point; only CoC/Red Card fouls tracked",penType:"warn",q:"What happens to most fouls committed during the autonomous period?",options:["They are penalized the same as driver-controlled fouls","They result in an immediate Yellow Card","They cost the autonomous ranking point but are NOT recorded as foul cards and don\u2019t affect the match score","They are ignored completely"],answer:2,explain:"Autonomous fouls cost the ranking point but are only tracked if related to Code of Conduct or resulting in a Red Card. Other fouls don\u2019t create foul cards or affect the score.",wrongExp:"Autonomous fouls are handled more leniently: the team loses their autonomous ranking point, but the foul is only formally recorded if it involves the RECF Code of Conduct or results in a red card. All other fouls do not generate foul cards and do not affect the overall match score. This gives teams room to learn during the autonomous period.",diff:"hard"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.5",ruleId:"Section 5.5",headline:"Ranking tiebreakers",ruleText:"Rankings and tiebreakers: 1. Average ranking points per match, 2. Average autonomous ranking points by team, 3. Average endgame ranking points by team, 4. Average win points by team, 5. Random electronic draw.",penalty:"N/A \u2014 Ranking procedure",penType:"info",q:"What is the first tiebreaker after average ranking points per match?",options:["Average win points","Average autonomous ranking points earned by team","Random electronic draw","Head-to-head record"],answer:1,explain:"The tiebreaker order is: (1) Avg ranking points, (2) Avg autonomous ranking points, (3) Avg endgame ranking points, (4) Avg win points, (5) Random draw.",wrongExp:"The tiebreaker hierarchy is specifically defined in Section 5.5: average ranking points first, then average autonomous ranking points, then average endgame ranking points, then average win points, and finally a random electronic draw. Head-to-head record is never used.",diff:"hard"},

{cat:"alliance",catLabel:"Alliance Matches",rule:"Section 5.5.1",ruleId:"Section 5.5.1",headline:"Autonomous Ranking Point",ruleText:"Each alliance can earn 1 ranking point for ending the autonomous period with: at least 3 cups and 4 halfpins scored across at least 2 goals, AND the alliance zone roller showing the matching alliance color.",penalty:"N/A \u2014 Ranking point criteria",penType:"info",q:"What must an alliance achieve during autonomous to earn the Autonomous Ranking Point?",options:["Score at least 10 points during autonomous","Score 3+ cups and 4+ halfpins across 2+ goals, AND set the alliance roller to their color","Park both robots at loaders","Score on the center goal"],answer:1,explain:"Both conditions required: at least 3 cups and 4 halfpins scored on 2+ goals, plus the alliance roller showing the correct color.",wrongExp:"The Autonomous Ranking Point has TWO mandatory conditions that must BOTH be met: (1) at least 3 cups and 4 halfpins scored across at least 2 goals, AND (2) the alliance zone roller showing the matching alliance color. Missing either condition means no ranking point, regardless of overall autonomous scoring.",diff:"hard"},

// ═══════ JUDGING & AWARDS (Section 6) ═══════
{cat:"judging",catLabel:"Judging & Awards",rule:"Section 6.1",ruleId:"Section 6.1",headline:"Engineering Notebooks",ruleText:"All documentation and work related to the engineering notebook must be completed by the students, and they can\u2019t use AI-generated content.",penalty:"May affect award eligibility",penType:"warn",q:"Can teams use AI-generated content in their engineering notebooks?",options:["Yes \u2014 AI tools are encouraged","Yes \u2014 if properly cited","No \u2014 AI-generated content is not allowed","Only for grammar checking"],answer:2,explain:"The manual explicitly prohibits AI-generated content in engineering notebooks. All work must be completed by students.",wrongExp:"Section 6.1 is unambiguous: teams cannot use AI-generated content in their engineering notebooks. All documentation and work must be completed by the students themselves. This ensures the notebook authentically reflects the students\u2019 own engineering design process, learning, and problem-solving.",diff:"easy"},

{cat:"judging",catLabel:"Judging & Awards",rule:"Section 6.2",ruleId:"Section 6.2",headline:"Team Interviews",ruleText:"Team interviews are face-to-face (or virtual) conversations between a team of students and two or more volunteer judges. Each team interview lasts about 10 minutes and in-person interviews generally take place between matches.",penalty:"N/A \u2014 Procedure",penType:"info",q:"How long does a team interview typically last?",options:["5 minutes","10 minutes","15 minutes","30 minutes"],answer:1,explain:"Each team interview lasts about 10 minutes, conducted between matches by two or more volunteer judges.",wrongExp:"Interviews last approximately 10 minutes and generally take place in person between matches. They involve two or more volunteer judges. Teams share their design process, match strategies, learning experiences, and overall approach to the competition.",diff:"easy"},

{cat:"judging",catLabel:"Judging & Awards",rule:"Section 6.3",ruleId:"Section 6.3",headline:"Award limits",ruleText:"Judges will choose winners of each award based on the specific award criteria in the RECF Guide to Judging. No team may receive more than one judged award at an event.",penalty:"N/A \u2014 Award rule",penType:"info",q:"How many judged awards can a single team receive at one event?",options:["Unlimited","Up to two","Up to three","No more than one"],answer:3,explain:"No team may receive more than one judged award at an event.",wrongExp:"The manual places a strict limit: no team may receive more than one judged award per event. This ensures awards are distributed across more teams. Note that performance awards (like tournament champion) are separate from judged awards and are automatically determined by the software.",diff:"easy"},
];

function qc(id){return Q.filter(q=>q.cat===id).length}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(){const cats=state.selectedCats.length?state.selectedCats:CATS.map(c=>c.id);state.questions=shuffle(Q.filter(q=>cats.includes(q.cat)));state.currentIdx=0;state.selectedAns=null;state.answered=false;state.results=[];state.showReview=false;state.screen="quiz";render()}
function selectAnswer(idx){if(state.answered)return;state.selectedAns=idx;state.answered=true;state.results.push({qIdx:state.currentIdx,correct:idx===state.questions[state.currentIdx].answer,selectedAns:idx});render()}
function nextQuestion(){if(state.currentIdx>=state.questions.length-1)state.screen="results";else{state.currentIdx++;state.selectedAns=null;state.answered=false}render();window.scrollTo({top:0,behavior:'smooth'})}
function goMenu(){state.screen="menu";state.selectedCats=[];render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleCat(id){state.selectedCats.includes(id)?state.selectedCats=state.selectedCats.filter(c=>c!==id):state.selectedCats.push(id);render()}
function render(){const app=document.getElementById('app');if(state.screen==='menu')app.innerHTML=renderMenu();else if(state.screen==='quiz')app.innerHTML=renderQuiz();else app.innerHTML=renderResults();bindEvents()}

return `<a href="quiz_launcher.html" class="back-link">\u2190 Back to Quiz Menu</a>
<div class="header"><div class="logo-badge"><span class="dot"></span>RECF ACHIEVE 2026-2027</div><h1>PINNACLE<br>Rules Quiz</h1><p>Test your knowledge of the RECF Achieve: Pinnacle Game Manual. Select categories or start with all ${Q.length} questions.</p></div>
<div class="categories">${CATS.map(c=>`<div class="cat-card ${state.selectedCats.includes(c.id)?'selected':''}" data-cat="${c.id}"><div class="cat-tag">${c.tag}</div><h3>${c.label}</h3><p>${c.desc}</p><div class="q-count">${qc(c.id)} Qs</div></div>`).join('')}</div>
<div class="btn-group"><button class="btn btn-primary" id="startBtn"${t===0?' disabled':''}>Start Quiz \u2014 ${t} Question${t!==1?'s':''}</button></div>`}

function renderQuiz(){
const q=state.questions[state.currentIdx],total=state.questions.length,pct=((state.currentIdx)/total*100).toFixed(0),L=['A','B','C','D'],ok=state.selectedAns===q.answer;
let exp='';
if(state.answered){
  if(ok){exp=`<div class="explanation correct-exp"><div class="exp-header">\u2713 Correct!</div><div class="exp-body">${q.explain}</div></div>`}
  else{const pc=q.penType==='warn'?'warn':q.penType==='info'?'info':'red';
    exp=`<div class="explanation wrong-exp"><div class="exp-header">\u2717 Incorrect</div><div class="exp-body" style="color:var(--text2)">${q.wrongExp}</div>
    <div class="exp-correct-ans"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 110 16A8 8 0 018 0zm3.5 5.3a.75.75 0 00-1.06-1.06L7 7.69 5.56 6.25a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l4-4z"/></svg><span>Correct Answer: ${L[q.answer]}. ${q.options[q.answer]}</span></div>
    <div class="rule-cite"><div class="rule-cite-header"><svg viewBox="0 0 16 16"><path d="M2 0a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V2a2 2 0 00-2-2H2zm1 3h10v1H3V3zm0 3h10v1H3V6zm0 3h7v1H3V9z"/></svg><span>Game Manual Citation</span></div>
    <div class="rule-cite-rule">${q.ruleId}</div><div class="rule-cite-headline">\u201c${q.headline}\u201d</div><div class="rule-cite-text">${q.ruleText}</div>
    <div class="rule-cite-penalty ${pc}">\u26a0 ${q.penalty}</div></div></div>`}
}
return `<div class="fade-in"><div class="progress-bar"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">${state.currentIdx+1} / ${total}</div></div>
<div class="quiz-card"><div class="q-category">${q.catLabel} <span class="diff-badge ${q.diff}">${q.diff}</span></div><div class="q-rule-ref">${q.rule}</div><div class="q-text">${q.q}</div>
<div class="options">${q.options.map((o,i)=>{let c='option';if(state.answered){c+=' locked';if(i===q.answer)c+=' correct';else if(i===state.selectedAns&&i!==q.answer)c+=' wrong'}return `<button class="${c}" data-idx="${i}"><span class="letter">${L[i]}</span><span>${o}</span></button>`}).join('')}</div>
${exp}${state.answered?`<div class="btn-group"><button class="btn btn-primary" id="nextBtn">${state.currentIdx>=state.questions.length-1?'See Results':'Next Question \u2192'}</button></div>`:''}</div></div>`}

function renderResults(){
const total=state.results.length,correct=state.results.filter(r=>r.correct).length,pct=Math.round(correct/total*100),circum=2*Math.PI*72,offset=circum-(circum*pct/100),color=pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)',L=['A','B','C','D'];
const msg=pct>=90?"Outstanding \u2014 you\u2019re ready for Pinnacle!":pct>=70?"Great job \u2014 solid rule knowledge!":pct>=50?"Not bad \u2014 review the sections you missed.":"Keep studying \u2014 the game manual is your best friend!";
const wrong=state.results.filter(r=>!r.correct);
return `<div class="results fade-in"><div class="logo-badge" style="margin-bottom:24px"><span class="dot"></span>QUIZ COMPLETE</div>
<div class="score-ring"><svg viewBox="0 0 160 160"><circle class="bg" cx="80" cy="80" r="72"/><circle class="fg" cx="80" cy="80" r="72" stroke="${color}" stroke-dasharray="${circum}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 1.2s ease"/></svg><div class="score-pct"><div class="num" style="color:${color}">${pct}%</div><div class="label">${correct} of ${total}</div></div></div>
<h2>${msg}</h2>
<div class="stat-row"><div class="stat green"><div class="val">${correct}</div><div class="lbl">Correct</div></div><div class="stat red"><div class="val">${total-correct}</div><div class="lbl">Incorrect</div></div><div class="stat"><div class="val">${total}</div><div class="lbl">Total</div></div></div>
${wrong.length>0?`<div class="review-toggle" id="toggleReview">${state.showReview?'\u25be Hide Missed Questions':'\u25b8 Review Missed Questions ('+wrong.length+')'}</div>
${state.showReview?`<div class="fade-in">${wrong.map(r=>{const q=state.questions[r.qIdx];return `<div class="review-item"><div class="ri-head"><div class="ri-icon">\u2717</div><div class="ri-q">${q.q}</div></div>
<div class="ri-detail"><strong>Your answer:</strong> ${L[r.selectedAns]}. ${q.options[r.selectedAns]}<br><strong style="color:var(--green)">Correct:</strong> ${L[q.answer]}. ${q.options[q.answer]}</div>
<div class="ri-cite"><div class="ri-cite-label">\ud83d\udcd6 ${q.ruleId}</div><div class="ri-cite-hl">\u201c${q.headline}\u201d</div><div class="ri-cite-text">${q.ruleText}</div><div class="ri-cite-pen">\u26a0 ${q.penalty}</div></div></div>`}).join('')}</div>`:''}`:''
}
<div class="btn-group" style="margin-top:32px"><button class="btn btn-primary" id="retryBtn">Try Again</button><button class="btn btn-secondary" id="menuBtn">Change Categories</button></div></div>`}

function bindEvents(){
document.querySelectorAll('.cat-card').forEach(el=>el.addEventListener('click',()=>toggleCat(el.dataset.cat)));
const s=document.getElementById('startBtn');if(s)s.addEventListener('click',startQuiz);
document.querySelectorAll('.option:not(.locked)').forEach(el=>el.addEventListener('click',()=>selectAnswer(parseInt(el.dataset.idx))));
const n=document.getElementById('nextBtn');if(n)n.addEventListener('click',nextQuestion);
const r=document.getElementById('retryBtn');if(r)r.addEventListener('click',startQuiz);
const m=document.getElementById('menuBtn');if(m)m.addEventListener('click',goMenu);
const t=document.getElementById('toggleReview');if(t)t.addEventListener('click',()=>{state.showReview=!state.showReview;render()})}
document.addEventListener('keydown',e=>{if(state.screen!=='quiz')return;if(!state.answered){const map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};const idx=map[e.key.toLowerCase()];if(idx!==undefined&&idx<state.questions[state.currentIdx].options.length)selectAnswer(idx)}else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();nextQuestion()}});
render();
</script>
</body>
</html>
